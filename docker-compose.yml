version: '3.8'

x-common-variables: &common-variables
  ENV: local

services:
  user-svc:
    build:
      context: ./
      dockerfile: ./cmd/user/Dockerfile
    ports:
      - '8080:8080'
    environment: *common-variables
    networks:
      - backend
  postgres:
    attach: false
    image: postgres:16.8-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: secret
    networks:
      - backend
  redis:
    attach: false
    image: redis:7.2.4-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
networks:
  backend:

